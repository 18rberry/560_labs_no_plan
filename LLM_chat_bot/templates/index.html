<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Chatbot</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="sidebar">
    <h2>LLM Chatbot</h2>

    <div class="section">
      <h3>Backend</h3>
      <label class="radio-card">
        <input type="radio" id="backend-opensource" name="backend" value="opensource" checked />
        <span>
          <strong>Open-Source (local)</strong>
          <small>FLAN-T5 + SentenceTransformer</small>
        </span>
      </label>
      <label class="radio-card">
        <input type="radio" id="backend-openai" name="backend" value="openai" />
        <span>
          <strong>OpenAI (API key req.)</strong>
          <small>GPT-4o-mini + OpenAI Embeddings</small>
        </span>
      </label>
    </div>

    <div class="section">
      <h3>PDF Upload</h3>
      <div class="upload-area">
        <input type="file" id="file-input" accept=".pdf" multiple />
        <label for="file-input" class="file-label">Choose PDF Files...</label>
        <ul id="pdf-list"></ul>
      </div>
      <button id="upload-btn">Analyze PDFs</button>
    </div>

    <div class="section">
      <p id="status-msg">Upload PDFs to begin.</p>
      <button id="reset-btn">Reset</button>
    </div>
  </div>

  <div id="chat-panel">
    <div id="chat-window"></div>
    <div id="input-bar">
      <textarea id="user-input" placeholder="Ask a question about your PDFs..." rows="1" disabled></textarea>
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>

  <script src="/static/js/script.js"></script>
</body>
</html>
